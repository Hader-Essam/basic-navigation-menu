<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Navigation Experience</title>
  <link rel="stylesheet" href="style.css">
  <!-- مكتبة الأيقونات FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="navbar-container">
    <nav class="navbar">
      <!-- اللوجو الفخم -->
      <a href="#" class="logo">
        <span class="logo-icon"><i class="fa-solid fa-code"></i></span>
        <span class="logo-text">AURA<span class="highlight">DEV</span></span>
      </a>

      <!-- روابط القائمة -->
      <ul class="nav-links" id="navLinks">
        <li><a href="#home" class="nav-link active"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="#services" class="nav-link"><i class="fa-solid fa-layer-group"></i> Services</a></li>
        <li><a href="#portfolio" class="nav-link"><i class="fa-solid fa-briefcase"></i> Portfolio</a></li>
        <li><a href="#about" class="nav-link"><i class="fa-solid fa-user"></i> About</a></li>
        <li><a href="#contact" class="nav-link"><i class="fa-solid fa-envelope"></i> Contact</a></li>
      </ul>

      <!-- أزرار التفاعل (CTA) -->
      <div class="nav-actions">
        <a href="#get-started" class="btn-glow">Get Started</a>
        
        <!-- زرار الموبايل الهامبرجر -->
        <button class="hamburger" id="hamburger" aria-label="Toggle Menu">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </nav>
  </header>

  <!-- خلفية جمالية لتوضيح تأثير الزجاج (Glassmorphism) -->
  <main class="hero-section">
    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>
    <div class="hero-content">
      <h1>Ultra-Modern & Responsive Navbar</h1>
      <p>Designed with Glassmorphism, Smooth Animations, and Premium UI/UX Standards.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
